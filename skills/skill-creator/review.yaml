activation:
  required: true
  reason: 'Release 3.6.0: new validation rules, packaging-policy changes and failure-handling
    changes across the engine; independent review required.'
independent_findings:
- id: OA-F1
  role: outcome-analyst
  severity: medium
  area: static_analysis containment
  finding: reference-escapes-skill was bypassed by refs starting with a runtime-output
    prefix (evals/../../x.md) because the prefix skip ran first.
  evidence: static_analysis.py _check_dead_references
- id: OA-F2
  role: outcome-analyst
  severity: low
  area: claims_check hollow-test detection
  finding: Every skipif was treated as hollow although a false-condition skipif still
    runs; runtime pytest.skip() and NotImplementedError bodies were missed.
  evidence: claims_check.py _is_hollow
- id: OA-F3
  role: outcome-analyst
  severity: low
  area: validate_all.sh vs CI parity
  finding: validate_all.sh tolerated exit 2 from source_rules, which CI treats as
    failure; CHANGELOG said it 'matches CI'.
  evidence: validate_all.sh; .github/workflows/test.yml
- id: SC-1
  role: scope-adversary
  severity: medium
  area: conflict
  finding: CHANGELOG said validate_all.sh matches CI but source_rules exit 2 passed
    locally and fails CI.
  evidence: validate_all.sh new loop; test.yml source_rules step
- id: SC-2
  role: scope-adversary
  severity: medium
  area: mishandling
  finding: Repo-level checks only ran when the target path string-equalled the toolkit,
    silently skipping them otherwise (symlinks, repo-root paths).
  evidence: validate_all.sh
- id: SC-3
  role: scope-adversary
  severity: medium
  area: over-scope
  finding: claims_check treated any skipif as hollow, beyond 'skipped/hollow'.
  evidence: claims_check.py _is_hollow
- id: SC-4
  role: scope-adversary
  severity: low
  area: under-scope
  finding: Hollow detection missed 'assert True', module-level pytestmark skips and
    skipped classes; CHANGELOG headline read stronger than the check.
  evidence: claims_check.py
- id: SC-5
  role: scope-adversary
  severity: low
  area: edge-case
  finding: Prefix bypass of reference-escapes-skill; backslash traversal not caught
    on POSIX.
  evidence: static_analysis.py
- id: SC-6
  role: scope-adversary
  severity: low
  area: assumption
  finding: CHANGELOG said a 'tests entry that is a file' but the code rejects 'tests'
    itself being a file.
  evidence: quick_validate.py; CHANGELOG
- id: SC-7
  role: scope-adversary
  severity: low
  area: over-scope
  finding: The 3.6.0 CHANGELOG section documents base-branch work (doc_sync, grading
    report) without saying the release bundles it.
  evidence: CHANGELOG.md
- id: SC-8
  role: scope-adversary
  severity: low
  area: dependency
  finding: plugin.json description is stale; the [Unreleased] compare link 404s until
    the tag exists.
  evidence: .claude-plugin/plugin.json; CHANGELOG.md footer
- id: AR-1
  role: architecture-reviewer
  severity: low
  area: viewer drain
  finding: The body drain was bounded by bytes but not wall-clock time; a slow drip
    could hold the single-threaded server.
  evidence: generate_review.py _discard_body
- id: AR-2
  role: architecture-reviewer
  severity: medium
  area: claims_check
  finding: Any skipif/xfail made a test hollow, including conditional skips and user-defined
    @skip helpers.
  evidence: claims_check.py _is_hollow
- id: AR-3
  role: architecture-reviewer
  severity: low
  area: claims_check
  finding: Hollow detection is easy to fool (assert True, bare return, pytest.skip(),
    module pytestmark).
  evidence: claims_check.py
- id: AR-4
  role: architecture-reviewer
  severity: low
  area: claims_check
  finding: Claim-source check had no containment; absolute and ../ paths passed if
    they existed.
  evidence: claims_check.py
- id: AR-5
  role: architecture-reviewer
  severity: low
  area: validate_all.sh
  finding: Repo-level checks silently skipped for other targets and source_rules was
    looser than CI.
  evidence: validate_all.sh
- id: PR-1
  role: practices-reviewer
