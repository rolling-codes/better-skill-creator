activation:
  required: true
  reason: Saved-eval validation changes covered runnable source; renew independent
    review against producer, comparison and preflight contracts.
independent_findings:
- role: outcome-analyst
  summary: 'The requested outcome is a minimal repair of six verified review concerns:
    accurate synchronized command documentation, modern Apache-2.0 project metadata,
    archive-safe release-history pointers, and trustworthy saved-evaluation comparisons
    that cannot manufacture passes or model identities. Preserve documented compatibility
    for legacy raw pairs and missing legacy threshold metadata while rejecting measurements
    that violate existing execution and identity invariants.'
  findings:
  - id: OUT-1
    severity: high
    area: evaluation integrity
    finding: Saved-result validation currently admits rows with no successful execution
      and arbitrary boolean passes, violating the existing measurement contract.
    evidence: Baseline compare_eval.py _validate_result checks nonnegative ok_runs
      and boolean pass but no positive successful count or relationship to threshold.
      run_eval.py:209-222 marks not clean or failed outcomes incomplete and computes
      pass as not incomplete AND the direction-specific threshold predicate. AGENTS.md
      Eval machinery says a failed execution is never counted as a pass.
  - id: OUT-2
    severity: high
    area: model identity
    finding: Matrix keys currently supply apparent identity when nested model is absent/null,
      so preflight can accept a baseline without evidence that the requested model
      executed.
    evidence: Baseline compare_eval.py normalize_result uses row.get("model") and
      checks mismatch only when truthy, then stores under key. validate_baseline matches
      requested names against those keys. decisions.md section 3 rejects configured
      defaults as explicit identity; the request explicitly requires nested model
      identity before fallback.
  - id: OUT-3
    severity: medium
    area: compatibility
    finding: A blanket requirement for threshold or explicit model on every raw saved
      result would exceed the request and break documented legacy compatibility.
    evidence: decisions.md sections 3-4 and docs/USER_GUIDE.md:330-332 preserve permissive
      legacy raw pairs and warn on missing threshold metadata. compare_results explicitly
      preserves raw single-pair API; test_actual_unknown_model_reports_block_envelope_comparison_and_preflight
      also asserts historical raw comparisons remain available.
  - id: OUT-4
    severity: medium
    area: archive and documentation correctness
    finding: The remaining documentation and metadata findings are valid and bounded,
      with overlapping changelog requests and a nonapplicable setuptools condition.
    evidence: AGENTS.md Front-end vs engine lists doctor/new/check/eval/package while
      bsc.py:229 adds compare/hooks. pyproject.toml license is table-form and no build-system
      exists. Both skill CHANGELOG.md and RELEASE_NOTES.md use ../../CHANGELOG.md,
      which escapes the packaged skill; the existing full-history pointer already
      supplies the intended absolute URL.
  - id: OUT-5
    severity: medium
    area: validation contract
    finding: Some existing threshold-provenance test data contradicts the requested
      validation; preserve the provenance behavior while correcting those fixtures
      rather than weakening the new semantic check.
    evidence: test_legacy_threshold_provenance_is_explicit_without_assumed_default
      sets trigger_threshold=0.9 on _result(), whose positive row has trigger_rate=0.8
      and pass=True, then expects success. That row violates run_eval pass semantics
      once threshold is known. The missing-metadata warning remains an independent
      required guarantee.
