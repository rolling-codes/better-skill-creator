activation:
  required: false
  reason: >-
    Five targeted evaluation correctness bug fixes: (1) scope grading to one
    behavior case, (2) bind grades to their evidence digest, (3) reject blank
    prompts before dispatch, (4) use declared frontmatter skill identity in
    provenance, (5) preserve infra failure diagnostics through run_eval and
    run_loop. No new operating modes, no architectural changes, no new external
    system integrations. All five changes are covered by new tests (totalling
    ~40 new test cases) and confirmed by passing the full suite minus the two
    pre-existing Windows-only encoding failures. Changes are within the
    evaluation engine scripts only.
