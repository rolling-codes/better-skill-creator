  - id: PR-EVIDENCE-SCHEMA
    severity: high
    practice: trust-boundaries
    file: scripts/review_gate.py
    location: lines 190-218
    finding: The behavioral gate accepts incomplete or internally contradictory evidence
      instead of validating the authored expectation set and typed provenance/count
      fields.
    evidence: The synthetic skill requires two distinct expectations. One row containing
      only verdict=PASS and passed=false, no text/evidence, summary passed=0,total=1,failed=-1,undetermined=-1,
      and transcript_integrity.complete="false" produced zero error findings. analyze
      checks verdict and row count, uses truthiness for complete, and checks only
      counts >0. The captured probe result is malformed_partial_evidence.
    suggested_fix: Validate nonempty unique text and evidence for every row; compare
      the exact expectation multiset to load_expectations; require complete is True,
      typed nonnegative integer counts, count agreement, and consistent passed/verdict
      fields. Fail closed at the shared evidence boundary.
    test_gap: New tests cover empty/non-PASS rows and mismatched summary total, but
      not missing authored expectations, missing evidence, truthy non-boolean completeness,
      contradictory passed fields, or negative summary counts.
  - id: PR-GRADING-SNAPSHOT-RACE
    severity: material
    practice: concurrency-toctou
    file: scripts/skill_test.py
    location: lines 248, 281, 301-305
    finding: Source identity is captured after grading, so source edits while the
      model runs are bound to evidence for the older source.
    evidence: The mocked call received [old assertion A, old assertion B], replaced
      expected_behavior.yaml with [NEW assertion never graded], and returned PASS
      for the old assertions. grade_behavior returned 0; provenance.skill_manifest_sha256
      matched the new current digest 9db2413144f5dd6da04bc1cab03fc81f46de8fc9bb92b4e60f068c0d8d06f7e2,
      not initial digest ce48acd12342e2a37a8ac78a92621d22faa88681a418202097a6eff5493161b5.
      A freshly bound gate then returned zero errors. See source_changed_during_grading.
    suggested_fix: Capture the source identity before reading grading inputs or invoking
      the model; grade a stable snapshot and/or reject if the source identity differs
      at completion. Never stamp an ungraded newer snapshot as the evidence source.
    test_gap: The transcript-byte race has a new regression test; no analogous source-mutation
      test surrounds the model call.
  - id: PR-EVIDENCE-PATH-CONTAINMENT
    severity: material
    practice: trust-boundaries
    file: scripts/review_gate.py
    location: lines 165-178
    finding: behavior_evidence_path may be absolute or traverse outside the skill
      root, allowing mutable unreviewed evidence to satisfy a source-bound review.
    evidence: A schema-complete synthetic report outside the skill root was accepted
      with behavior_evidence_path="../outside.json" and again with an absolute path;
      both returned zero error findings. The external file is absent from source_manifest,
      so later content changes are not protected by the recorded manifest. See evidence_path_escape.
    suggested_fix: Require a relative path, resolve it under skill_path, reject traversal/absolute
      paths/links, and read it from the same bounded snapshot that supplies the manifest.
    test_gap: The nested-evidence test checks only a valid contained evals path; there
      is no negative path containment coverage for this field.
