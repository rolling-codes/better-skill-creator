accepted_limitations:
- claims_check's hollow-test detection is a heuristic; subtler vacuous assertions
  still count as verifying.
- The 411/413 early replies in the eval viewer are not drained and can still race.
- A hard kill between the temp write and rename can leave a *.tmp beside a grading
  report.
- validate_all.sh does not run pyright and only runs the repo-level checks when the
  target is the toolkit.
- doc_sync does not scan fenced blocks indented 4+ spaces inside list items; behavior_manifest_digest
  ignores every *.grading.json.
- bsc.py eval --grade-transcript writes behavior_evidence.json under runs/<id>/ (pre-existing).
- 'Reference and claim-source containment is point-in-time: it does not defend against
  a symlink swapped by another process during analysis.'
- The generated-report exclusion (summary + provenance hashes) identifies the tool's
  own output; it is not a signature.
- Report and evidence from concurrent grading runs are two atomic writes, not an atomic
  pair; each carries the same provenance.
- Hollow-test detection does not see pytest.skip() inside with/try/for or aliased
  imports, nor 'pytestmark += [...]'.
- 'ADV75-F1: _is_hollow misses several vacuous tests, so a claim backed by one still
  counts as verified. Verified cases: assert 1 == 1, assert not False, assert True
  is True, with pytest.raises(...): pass, pytest.'
- 'ADV75-F2: The viewer''s early-reply drain covers only 403 and 415. A POST to a
  path other than /api/feedback gets a 404 without draining the body. A 403 or 415
  reply with Content-Length over 1 MiB is not drained'
- 'ADV75-F3: The CHANGELOG said the old test failed ''roughly one run in six''. Nothing
  in the repo supported that figure; the measurement was 4 of 25 repeated runs on
  one Windows machine, and the CHANGELOG and test'
- 'ADV2-F2: pytest.skip() inside with, try or for blocks, or inside a literal ''if
  True:'', is still counted as verification because the check only inspects top-level
  statements; aliased imports (import pytest as p'
