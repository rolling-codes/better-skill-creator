activation:
  required: true
  reason: Source change to the review CLI, doc-sync validator and transcript-grading
    evidence binding; independent review required.
independent_findings:
- id: OA-1
  role: outcome-analyst
  severity: medium
  area: integration
  finding: Default grade_behavior output no longer produced the behavior_evidence.json
    that review_gate reads; a plain --grade-only run could not satisfy the gate.
  evidence: skill_test.py evidence_name derivation; review_gate.py evidence_target
- id: OA-2
  role: outcome-analyst
  severity: low
  area: file_policy
  finding: behavior_manifest_digest excluded anything ending in grading.json (e.g.
    regrading.json), weakening source binding.
  evidence: file_policy.py behavior_manifest_digest
- id: OA-3
  role: outcome-analyst
  severity: low
  area: skill_test
  finding: Evidence naming depended on --grade-output being exactly grading.json;
    custom names produced unreadable evidence names.
  evidence: skill_test.py evidence_name vs aggregate_benchmark.py
- id: SC-1
  role: scope-adversary
  severity: medium
  area: under-scoping
  finding: The new default evidence file name was invisible to review_gate (reader
    of the old default path).
  evidence: skill_test.py; review_gate.py:163-168; README
- id: SC-2
  role: scope-adversary
  severity: low
  area: over-scoping
  finding: endswith('grading.json') exclusion silently hid unrelated source files
    from the integrity digest.
  evidence: file_policy.py behavior_manifest_digest
- id: SC-3
  role: scope-adversary
  severity: low
  area: over-scoping
  finding: CLAUDE.md edits (orphan-file wording, review lifecycle) go beyond the review-subcommand
    request.
  evidence: CLAUDE.md diff
- id: AR-1
  role: architecture-reviewer
  severity: medium
  area: evidence/provenance binding
  finding: Default evidence file name '<stem>.behavior_evidence.json' decoupled the
    grading default from the gate's fixed lookup.
  evidence: skill_test.py; review_gate.py
- id: AR-2
  role: architecture-reviewer
  severity: medium
  area: provenance digest exclusion
  finding: Exclusion by suffix also dropped legitimate files (foo_grading.json, xbehavior_evidence.json)
    and was case-sensitive.
  evidence: file_policy.py
- id: AR-3
  role: architecture-reviewer
  severity: low
  area: collision-freedom / atomicity
  finding: Report and evidence were each atomic but not as a pair; evidence names
    derived from out.stem collided for a.json vs a.txt.
  evidence: skill_test.py
- id: AR-4
  role: architecture-reviewer
  severity: medium
  area: doc_sync bypass
  finding: The invocation regex matched only the literal 'python -m'; python3, py
    and PowerShell backtick continuations were not validated.
  evidence: doc_sync.py _REVIEW_INVOCATION
- id: AR-5
  role: architecture-reviewer
  severity: low
  area: doc_sync false positives
  finding: The subcommand token was any non-space text and prose was scanned, so sentences
    like 'python -m scripts.review and then' failed.
  evidence: doc_sync.py
- id: AR-6
  role: architecture-reviewer
  severity: low
  area: coupling
  finding: doc_sync imports scripts.review at module scope; COMMANDS assumes every
    command takes one skill-path argument.
  evidence: doc_sync.py:27; review.py
- id: PR-1
  role: practices-reviewer
  severity: medium
  area: blind-spots
  finding: behavior_manifest_digest exclusion by endswith dropped upgrading.json /
    regrading.json from the evidence binding.
  evidence: file_policy.py
- id: PR-2
  role: practices-reviewer
  severity: medium
  area: blind-spots
  finding: Report and evidence not written as a pair; default evidence name never
    found by review_gate; stem collisions.
  evidence: skill_test.py; review_gate.py
- id: PR-3
  role: practices-reviewer
  severity: low
  area: concurrency-toctou
  finding: A hard kill between mkstemp and replace leaves a *.tmp beside the report;
    mkstemp creates mode 0600 files.
  evidence: skill_test.py _write_atomic
- id: PR-4
  role: practices-reviewer
  severity: low
  area: root-cause-discipline
  finding: '''<cmd>'' placeholder is skipped everywhere and prose outside code is
    scanned, producing false positives that fail closed.'
  evidence: doc_sync.py
disagreements:
- 'Scope-adversary rated the default-path rename as breaking aggregate_benchmark/viewer
  readers; the architecture reviewer found no reader that depended on the old default.
  Resolved by evidence: bsc.py passes an explicit grading.json, so only direct skill_test
  users are affected; documented instead of reverting.'
consolidated_decision:
  chosen_interpretation: Documented `python -m scripts.review <cmd>` invocations are
    validated against the same COMMANDS table the CLI dispatches through; transcript
    grading reports are collision-free and atomic while the evidence file keeps the
    fixed name review_gate reads.
  accepted_findings:
  - OA-1
  - OA-2
  - OA-3
  - SC-1
  - SC-2
  - AR-1
  - AR-2
  - AR-3
  - AR-4
  - AR-5
  - PR-1
  - PR-2
  - PR-4
  rejected_findings:
  - 'SC-3 (kept: the CLAUDE.md corrections fix claims the new checks proved wrong)'
  - 'AR-6 (kept: single shared table is the requested design)'
  - 'PR-3 (accepted limitation: hard-kill temp file, 0600 mode)'
  unresolved_conflicts: []
  supported_modes:
  - --grade-only --grade-transcript
  - trigger tests then grading
  - doc_sync over README/CLAUDE/SETUP/SKILL/references
  validation_strategy: Regression tests for each accepted finding; doc_sync, source_rules,
    claims_check, quick_validate, lint, static_analysis, pyright; fresh completion-adversary
    on the fixed tree.
completion_adversary_report:
  role: completion-adversary
  verdict: complete
  summary: Fresh adversary on the fixed tree found no unmet outcome. Three low findings
    (ADV-1..3) are accepted limitations. Shared command table, narrow digest exclusion
    and write-order are pinned by tests.
  probes:
  - doc_sync probed with fenced blocks, inline code, double-backtick spans, leading
    .venv/bin/python, python.exe, -X flags, quoted/uppercase tokens, bare scripts.review,
    backslash and backtick continuations (CRLF too)
  - 155 tests in test_doc_sync, test_grade_transcript_documented, test_skill_test_grader
    passed
adversarial_findings:
- id: ADV-1
  severity: low
  type: unwired resource (pre-existing)
  finding: bsc.py eval --grade-transcript writes behavior_evidence.json under runs/<id>/,
    which review_gate does not read without a manual copy or behavior_evidence_path.
- id: ADV-2
  severity: low
  type: evasion
  finding: doc_sync's fence regex allows at most 3 leading spaces, so a fenced block
    indented 4+ spaces in a list item is not scanned.
- id: ADV-3
  severity: low
  type: unsupported assumption
  finding: behavior_manifest_digest excludes every *.grading.json at any depth, so
    a fixture with that name can change without invalidating evidence.
finding_disposition:
- finding_id: OA-1
  finding: Default grade_behavior output no longer produced the behavior_evidence.json
    that review_gate reads
  disposition: fixed
  note: Evidence is always written as behavior_evidence.json (the gate's name), before
    the report; test_default_run_writes_the_evidence_file_review_gate_reads.
- finding_id: SC-1
  finding: The new default evidence file name was invisible to review_gate
  disposition: fixed
  note: Same fix as OA-1.
- finding_id: AR-1
  finding: Default evidence file name decoupled the grading default from the gate's
    fixed lookup
  disposition: fixed
  note: Same fix as OA-1.
- finding_id: PR-2
  finding: Report and evidence not written as a pair; default evidence name never
    found by review_gate
  disposition: fixed
  note: Fixed evidence name, and evidence is written first so an existing report always
    has fresh evidence beside it.
- finding_id: OA-2
  finding: behavior_manifest_digest excluded anything ending in grading.json
  disposition: fixed
  note: Exact-name rule (_is_generated_grading_artifact); test_behavior_digest_ignores_only_generated_grading_artifacts.
- finding_id: SC-2
  finding: endswith('grading.json') exclusion hid unrelated source files
  disposition: fixed
  note: Same fix as OA-2.
- finding_id: AR-2
  finding: Exclusion by suffix dropped legitimate files and was case-sensitive
  disposition: fixed
  note: Same fix as OA-2; comparison is case-insensitive.
- finding_id: PR-1
  finding: behavior_manifest_digest exclusion by endswith dropped upgrading.json /
    regrading.json
  disposition: fixed
  note: Same fix as OA-2.
- finding_id: OA-3
  finding: Evidence naming depended on --grade-output being exactly grading.json
  disposition: fixed
  note: Evidence name no longer depends on --grade-output.
- finding_id: AR-3
  finding: Report and evidence not atomic as a pair; stem collisions
  disposition: fixed
  note: Fixed evidence name removes the stem collisions; write order documents the
    pairing guarantee.
- finding_id: AR-4
  finding: The invocation regex matched only the literal 'python -m'
  disposition: fixed
  note: _PYTHON_M accepts python, python3, py and interpreter flags; backslash and
    PowerShell backtick continuations; tests added.
- finding_id: AR-5
  finding: Subcommand token was any non-space text and prose was scanned
  disposition: fixed
  note: Only fenced blocks and inline code are scanned; trailing sentence punctuation
    tolerated; tests added.
- finding_id: PR-4
  finding: '''<cmd>'' placeholder skipped everywhere and prose scanned'
  disposition: fixed
  note: Prose is no longer scanned; the '<cmd>' placeholder skip is deliberate and
    documented in the code.
- finding_id: PR-3
  finding: A hard kill leaves a *.tmp beside the report; mkstemp creates mode 0600
    files
  disposition: accepted_limitation
  note: A leftover .tmp only appears after a hard kill inside a skill dir; reports
    being 0600 is acceptable for generated evidence.
- finding_id: AR-6
  finding: doc_sync imports scripts.review at module scope; COMMANDS assumes one skill-path
    argument
  disposition: accepted_limitation
  note: The shared table is the point of the change; a command with different arguments
    would need the table to grow.
- finding_id: SC-3
  finding: CLAUDE.md edits go beyond the review-subcommand request
  disposition: accepted_limitation
  note: The edits correct statements the new checks proved wrong (there is no 'review
    run'; orphans are warnings).
- finding_id: ADV-1
  finding: bsc.py eval --grade-transcript writes behavior_evidence.json under runs/<id>/
  disposition: accepted_limitation
  note: Pre-existing behavior on main, unchanged here; the gate needs behavior_evidence_path
    or a copy.
- finding_id: ADV-2
  finding: A fenced block indented 4+ spaces is not scanned by doc_sync
  disposition: accepted_limitation
  note: Rare in these docs and fails open only for that one construct.
- finding_id: ADV-3
  finding: behavior_manifest_digest excludes every *.grading.json at any depth
  disposition: accepted_limitation
  note: These are the names skill_test generates; a source fixture named *.grading.json
    is not supported.
completion_gate_status: passed
accepted_limitations:
- A hard kill between mkstemp and os.replace can leave a *.tmp file; generated reports
  are mode 0600.
- The latest graded run's behavior_evidence.json wins when several transcripts are
  graded into one directory.
- bsc.py eval --grade-transcript writes behavior_evidence.json under runs/<id>/ (pre-existing);
  the gate needs behavior_evidence_path or a copy.
- doc_sync does not scan fenced blocks indented 4+ spaces inside list items, nor prose
  outside code.
- behavior_manifest_digest ignores every *.grading.json file at any depth.
unresolved_decisive_questions: []
