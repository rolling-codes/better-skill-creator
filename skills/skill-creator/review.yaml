activation:
  required: true
  reason: 'Release v3.5.1: fresh review of source manifest binding and the behavioral
    evidence gate; historical docs/metadata approval is archived, not carried forward.'
independent_findings:
- role: outcome-analyst
  summary: The requested outcome is an independently supported v3.5.1 release decision
    for the manifest binding and new behavioral evidence gate, with completion withheld
    until fresh reports and an adversary verdict exist. The inspected record now correctly
    withholds completion (not_run), and the deterministic source gate detects stale
    source. The new behavioral gate still admits incomplete and internally inconsistent
    evidence, so its presence alone cannot support a passing completion claim.
  findings:
  - id: OA-351-01
    severity: high
    area: behavioral-evidence-coverage
    finding: The behavioral gate can accept evidence that does not cover the declared
      behavior suite and contradicts its own passed count.
    evidence:
      source:
      - scripts/review_gate.py:183-188 checks container types only.
      - scripts/review_gate.py:209-214 checks nonempty PASS rows and summary.total
        equal to supplied row count, without matching row text to tests/expected_behavior.yaml
        or requiring per-row evidence.
      - scripts/review_gate.py:216-222 ignores summary.passed and accepts summary.verdict=PASS
        with zero failed/undetermined.
      - scripts/skill_test.py:192-228 performs stronger row validation when the supported
        grader is used, but the completion gate does not enforce those constraints
        when reading an artifact.
      observed_probe:
        expected_behavior_count: 2
        evidence_rows:
        - verdict: PASS
        evidence_summary:
          verdict: PASS
          total: 1
          passed: 0
          failed: 0
          undetermined: 0
        transcript_file_exists: false
        error_rules: []
        warning_rules:
        - review-agent-unwired
        - review-agent-unwired
        - review-agent-unwired
        - review-agent-unwired
    impact: A completion claim can pass the new gate even though none of the skill
      requirements has an identified, evidenced passing judgment. This is a shape/consistency
      defect even when reviewer authenticity remains maintainer-verified.
  - id: OA-351-02
    severity: high
    area: behavioral-source-binding
    finding: Behavioral provenance is hashed after grading has completed, so the digest
      can identify source bytes that were not the grading inputs if the skill changes
      during the model call.
    evidence:
    - scripts/skill_test.py:248 reads expectations from the skill.
    - scripts/skill_test.py:275-284 constructs the grading prompt and calls call_claude_text.
    - scripts/skill_test.py:301 computes behavior_manifest_digest only after the call
      and grading validation.
    - scripts/review_gate.py:200 compares evidence against the current digest and
      cannot detect the earlier-input/later-digest mismatch.
    impact: A syntactically fresh evidence artifact need not demonstrate evaluation
      against the source it claims to bind. This finding is based on inspected control
      flow; no concurrent-mutation execution was performed.
  - id: OA-351-03
    severity: medium
    area: release-review-provenance
    finding: The retained historical synthesis and adversary report describe a docs/metadata
      release and do not constitute a fresh assessment of the evidence gate.
    evidence:
    - review.yaml:136-138 characterizes the substantive change as design-analysis
      scale definitions.
    - review.yaml:186-208 says the completion adversary confirmed metadata/design-analysis
      release state.
    - references/independent-review.md:148-153 requires fresh reports after restarting
      and forbids refreshing hashes alone.
    - At the recorded snapshot, completion_gate_status is not_run and analyze() returns
      review-stale and review-gate-not-passed.
    impact: The current withheld status is appropriate. Approval remains outstanding
      until the new reports and adversary verdict are consolidated for the final source.
  source_manifest_sha256: 2577cb1423e4dcec6b56f5d5ba32676b9ee8d6eccaf3ea27401f6bdfe006219b
  report_sha256: ed1de5f51a8d43ebcafa59a4ebbbc5a376d18e876f4c2955e20815c6f06b6dba
  scope: Source manifest binding and behavioral evidence gate. Snapshot is evidence
    of inspected bytes, not approval of later changes.
- role: scope-adversary
  summary: The manifest and declared-evidence checks are a useful boundary, but the
    behavioral gate can still accept evidence that does not grade the skill expectations,
    read evidence outside the reviewed tree, and bind an old execution to source edited
    during grading. These gaps prevent an unqualified completion claim for this snapshot.
  findings:
  - id: SCOPE-351-1
    severity: high
    type: under-scope
    finding: Behavioral evidence need not cover the skill's declared expectations,
      or contain any supporting text or evidence.
    evidence: scripts/review_gate.py:209-213 only checks for a nonempty list of dicts
      whose verdict is PASS and a matching total; it does not load tests/expected_behavior.yaml
      or validate row text/evidence/passed. scripts/skill_test.py:194-222 enforces
      those stronger checks when generating reports, but the release gate does not
      enforce them when reading reports. Scratch fixture with nine authored expectations
      and expectations=[{"verdict":"PASS"}] returned no gate errors.
    scenario: An evaluation accidentally points at an incomplete or unrelated report.
