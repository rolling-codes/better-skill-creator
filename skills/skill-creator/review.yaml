activation:
  required: true
  reason: 'Re-review triggered by editing SKILL.md (manifest-covered) and adding tests/test_grade_transcript_documented.py.
    Full independent review run at the user''s explicit request (the narrow-change
    activation skip was available but declined), bound to the current source via `scripts.review
    restart`. Pre-draft reviewers: outcome-analyst, scope-adversary, architecture-reviewer,
    practices-reviewer; plus a completion-adversary gate.'
independent_findings:
- id: F1
  role: outcome-analyst
  severity: high
  area: entailment
  finding: First-draft command omitted --grade-only, so `skill_test <skill> --grade-transcript
    <transcript>` ran the live trigger/baseline eval first (model calls) - not the
    headless path the prose promised.
  evidence: 'skill_test.py main(): code=0 if args.grade_only else run_trigger_tests(...)'
- id: F2
  role: outcome-analyst
  severity: material
  area: interpretation
  finding: '''offline'' overstated: grade_behavior always makes one grader model call
    (call_claude_text), so the route is headless but not offline/model-free.'
  evidence: skill_test.py grade_behavior -> call_claude_text (one call)
- id: F3
  role: scope-adversary
  severity: material
  area: mishandling
  finding: Bare --grade-transcript (no --grade-only) also launches the trigger eval
    before grading - extra live work an author grading a saved transcript did not
    intend.
  evidence: skill_test.py main() lines 154-159
- id: F4
  role: scope-adversary
  severity: material
  area: conflict
  finding: README 'offline' claim conflicted with grade_behavior's model call; only
    'headless / without the live baseline-and-subagent loop' is accurate.
  evidence: README.md 'How it works' vs skill_test.py:124
- id: F5
  role: architecture-reviewer
  severity: medium
  area: self-validation
  finding: doc_sync validates module existence but not flags on `python -m scripts.X`,
    so a removed --grade-transcript flag would go uncaught by doc_sync.
  evidence: doc_sync.py _check_modules (module-only); flag checks scoped to bsc.py
- id: F6
  role: architecture-reviewer
  severity: medium
  area: tests
  finding: First-draft regression test asserted only substring presence, so it could
    pass while the documented command was wrong.
  evidence: test_grade_transcript_documented.py (pre-fix)
- id: F7
  role: practices-reviewer
  severity: low
  area: consistency
  finding: 'Invocation-form drift: expected_behavior.yaml header uses `python scripts/skill_test.py`
    while SKILL.md/CLAUDE.md use `python -m scripts.skill_test`; README stays conceptual
    (behavior-vs-trigger distinction lives in SKILL.md).'
  evidence: expected_behavior.yaml:11 vs SKILL.md / CLAUDE.md
disagreements: []
consolidated_decision:
  chosen_interpretation: 'Narrow documentation-discoverability change: surface the
    pre-existing behavior-grading route (scripts/skill_test.py --grade-only --grade-transcript,
    grading tests/expected_behavior.yaml via agents/grader.md) in the two author-facing
    surfaces (SKILL.md Step 4 and README ''How it works'') and lock it with a regression
    test. The independent review corrected the first draft, which (a) omitted --grade-only
    so the command ran the live trigger loop, (b) overclaimed ''offline'' when grade_behavior
    makes one grader model call, and (c) misstated a checklist fallback. Final docs
    name the accurate `--grade-only --grade-transcript` route, claim only ''headless
    ... without the live baseline-and-subagent loop'', and the test requires the correct
    combined flag form plus asserts both flags still exist in skill_test''s parser.
    No skill behavior/architecture/scope/mode/permission change.'
  accepted_findings:
  - F1
  - F2
  - F3
  - F4
  - F5
  - F6
  - F7
  - CA1
  - CA2
  rejected_findings: []
completion_adversary_report:
  role: completion-adversary
  verdict: complete
  summary: Probed flag semantics, README accuracy, test discrimination, authorization,
    and regression. --grade-only genuinely skips run_trigger_tests (main() code=0
    branch); grade_behavior makes exactly one call_claude_text; README claims only
    'headless ... without the full live baseline-and-subagent loop' (no false 'offline');
    the test requires the correct combined flag form and asserts both flags exist
    in the parser; no behavior/scope/permission change. No high or material finding.
  findings:
  - id: CA2
    severity: low
    type: hollow-test
    finding: The doc test guards flag existence + pointer + combined-form, not the
      runtime semantics of --grade-only; that behavior is covered independently by
      tests/test_skill_test_grader.py.
    evidence: test_grade_transcript_documented.py vs test_skill_test_grader.py
