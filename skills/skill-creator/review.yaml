adversarial_findings:
- id: ADV75-F1
  severity: low
  type: hollow-test-heuristic
  finding: '_is_hollow misses several vacuous tests, so a claim backed by one still
    counts as verified. Verified cases: assert 1 == 1, assert not False, assert True
    is True, with pytest.raises(...): pass, pytest.skip() inside an if block, and
    raise builtins.NotImplementedError. The CHANGELOG says the check is a heuristic,
    so this matches the stated limit.'
- id: ADV75-F2
  severity: low
  type: unhandled-failure-path
  finding: The viewer's early-reply drain covers only 403 and 415. A POST to a path
    other than /api/feedback gets a 404 without draining the body. A 403 or 415 reply
    with Content-Length over 1 MiB is not drained either. Both can still reset the
    connection on Windows. The CHANGELOG mentioned only the 411/413 race, so the 404
    case was undisclosed (now added to the CHANGELOG).
- id: ADV75-F3
  severity: low
  type: unsupported-claim
  finding: The CHANGELOG said the old test failed 'roughly one run in six'. Nothing
    in the repo supported that figure; the measurement was 4 of 25 repeated runs on
    one Windows machine, and the CHANGELOG and test docstring now say exactly that.
- id: ADV2-F1
  severity: low
  type: residual-gap
  finding: 'The generated-report exclusion keyed on the mere presence of a ''provenance''
    dict, so a fixture with an empty provenance object was still dropped from the
    evidence digest. Addressed after this run: the predicate now also requires a summary
    object and the transcript_sha256 and skill_manifest_sha256 strings; the rule identifies
    the tool''s own output and is not a signature.'
- id: ADV2-F2
  severity: low
  type: declined-item-note
  finding: pytest.skip() inside with, try or for blocks, or inside a literal 'if True:',
    is still counted as verification because the check only inspects top-level statements;
    aliased imports (import pytest as pt; from pytest import skip) and 'pytestmark
    += [...]' are also not detected. Declining is defensible for a documented heuristic.
- id: ADV2-F3
  severity: low
  type: declined-item-note
  finding: Nothing in review_gate or skill_test compares the grading report to the
    evidence file, and review_gate reads only behavior_evidence.json, which is internally
    consistent. Only a human or the viewer reading a mismatched report could be misled;
    the CHANGELOG and benchmark-methodology.md state this.
- id: ADV2-F4
  severity: low
  type: declined-item-note
  finding: A symlink swapped between the containment check and the existence check
    is not defended against; documented as a point-in-time check on a tree nobody
    is modifying.
- id: ADV77-001
  severity: high
  type: unmet-outcome
  finding: An earlier adversary run tested uncommitted claims_check edits, so its
    green results did not prove the committed tree.
- id: ADV77-002
  severity: low
  type: assumption
  finding: Pyright is a CI step and had not been run on the changed claims_check code.
- id: ADV77-003
  severity: low
  type: hollow-test
  finding: No test covered an annotated pytestmark skip under an if.
- id: ADV77-004
  severity: low
  type: failure-path
  finding: claims_check prints a mojibake character on a cp1252 Windows console; cosmetic.
- id: ADV77B-1
  severity: low
  type: assumption
  finding: The review gate was stale until this renewed review.yaml is committed.
- id: ADV77B-2
  severity: low
  type: assumption
  finding: The ubuntu half of the CI matrix could not be exercised from the Windows
    review environment.
