activation:
  required: true
  reason: >-
    Substantial change — PR #67 "bug-prevention phase 1" adds new runnable gate
    scripts (source_rules, claims_check, doc_sync), review-gate correctness, and
    CI wiring to the skill-creator meta-skill. Ships code, so the practices
    reviewer applies.
independent_findings:
  - { id: OA1, role: outcome-analyst, severity: high, area: wiring,
      finding: "source_rules.py, claims_check.py and doc_sync.py are orphaned — unreferenced in SKILL.md, so under progressive disclosure the model never loads them; the skill trips the very invariant it enforces.",
      evidence: "static_analysis . -> 3 orphaned-file warnings; grep of SKILL.md finds no references" }
  - { id: OA2, role: outcome-analyst, severity: medium, area: coverage,
      finding: "io.open('x.txt') is an identical encoding bug but is not flagged — the binding model tracks only builtin open and pathlib.",
      evidence: "scan_file on io.open probe -> no finding; bindings seed {'open':'open'} only" }
  - { id: OA3, role: outcome-analyst, severity: info, area: contract,
      finding: "Exit-code contract is correct; an apparent exit-0-on-failed-gate was a shell pipe artifact ($? captured tail, not python).",
      evidence: "review_gate exit 1; static_analysis exit 2; source_rules exit 0 when measured directly" }
  - { id: OA4, role: outcome-analyst, severity: info, area: quality,
      finding: "Gate hardening is honest: CONSOLIDATED_REQUIRED_KEYS rejects placeholder syntheses; residual trust gaps G1-G4 are documented, not hidden. 130 new tests pass.",
      evidence: "review_gate.py / finding_types.py diff; pytest" }
  - { id: SA1, role: scope-adversary, severity: high, area: scope,
      finding: "PR labelled 'phase 1' also ships claims_check and doc_sync, which the branch's own commit messages tag as phase 2; claims.yaml introduces a standalone claim-registry subsystem.",
      evidence: "git log shows commits 12f1f6b and f188aec tagged '(phase 2)'; claims.yaml is a 90-line registry schema" }
  - { id: SA2, role: scope-adversary, severity: high, area: ci,
      finding: "CI runs source_rules/doc_sync/claims_check without the exit-2 guard its siblings use, so a documented warnings-only exit (2) would hard-fail the build, breaking the 0/1/2 contract.",
      evidence: ".github/workflows/test.yml new steps lacked the exit-2 tolerance; doc_sync/claims_check _main return 2 on warnings" }
  - { id: SA3, role: scope-adversary, severity: medium, area: detector,
      finding: "H-SWALLOW reason-marker regex includes bare 'ok'/'expected' tokens, so '# ok:' trivially disables the detector with no real justification.",
      evidence: "regex matches '# ok: whatever'" }
  - { id: SA4, role: scope-adversary, severity: medium, area: wiring,
      finding: "New scripts trip the repo's own orphaned-file invariant and are undocumented in SKILL.md/CLAUDE.md.",
      evidence: "static_analysis -> 3 orphaned-file warnings; CLAUDE.md unchanged in diff" }
  - { id: SA5, role: scope-adversary, severity: info, area: scope,
      finding: "A pyright type-check CI step rides along in the same PR, unrelated to the two named detectors.",
      evidence: "test.yml adds 'Type-check (pyright)' step" }
  - { id: SA6, role: scope-adversary, severity: info, area: detector,
      finding: "H-ENCODING deliberately under-reaches on indirectly-obtained file handles (unknown receivers) — an intentional false-negative floor.",
      evidence: "good fixture H-ENCODING/good/unknown_receivers.py encodes this as expected-clean" }
  - { id: AR1, role: architecture-reviewer, severity: medium, area: wiring,
      finding: "The three new scripts are invoked in CI but unreferenced in SKILL.md; the toolkit's own static_analysis flags them orphaned.",
      evidence: "static_analysis -> 3 orphaned-file warnings" }
  - { id: AR2, role: architecture-reviewer, severity: high, area: ci,
      finding: "CI runs doc_sync/claims_check without exit-2 tolerance, so a single warning-only finding (broken doc link, claim-status warning) hard-fails CI against the toolkit's own contract.",
      evidence: "test.yml bare 'python -m scripts.doc_sync'/'claims_check'; both _main return 2 on warnings-only" }
  - { id: AR3, role: architecture-reviewer, severity: medium, area: ci,
      finding: "The pyright step runs 'pyright --project .' from repo root and pins pythonPlatform Linux; may check little of the engine and won't surface Windows-specific type issues.",
      evidence: "pyrightconfig.json exclude list + pythonPlatform Linux; step has no working-directory" }
  - { id: AR4, role: architecture-reviewer, severity: info, area: architecture,
      finding: "source_rules.py integrates cleanly with Finding/exit-code architecture and is correctly distinct from static_analysis.py (raw AST vs loaded Skill); AST handling errs conservatively.",
      evidence: "edge-case probes flag walrus/open-kwarg/conditional; reassign-to-int goes clean" }
  - { id: PR1, role: practices-reviewer, severity: medium, area: review-engine,
      finding: "Disposition id/text keys don't reconcile: an id-bearing finding disposed by text never matches and stays blocking, with no diagnostic. Fail-closed (over-blocks), not dangerous.",
