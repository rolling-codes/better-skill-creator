name: skill-creator
version: 3.4.0
schemaVersion: 1
author: RollingCodes (fork of Anthropic's skill-creator)
created: 2026-01-01
last-audit: 2026-10-02
compatibility: "Claude Code, claude.ai — requires subprocess access to `claude -p` for run_eval.py and improve_description.py"

audit:
  last_run: 2026-10-02
  status: passing
  notes: "v3.0.1: fixed the Claude CLI resolver so `bsc.py eval --live` runs on current Claude Code installs — claude_process.claude_command now resolves the native bin/claude.exe (and POSIX bin/claude) that Claude Code ships today, falling back to the legacy node+cli.js layout. Before this, on Windows the .CMD shim pointed at a cli.js that no longer exists, so claude_command raised FileNotFoundError, which run_eval recorded as SUBPROCESS_CRASH and reported as infrastructure_failed on every query — live trigger evals could not run at all. v3.0.0: frontmatter now stays inside the Agent Skills spec so generated skills upload to claude.ai and the Skills API — schemaVersion moved under metadata (quick_validate rejects the top-level key; migrate_skill moves it), allowed-tools uses real Claude Code tool names with narrow scopes and a new invalid-tool-name lint rule, scorer no longer rewards pre-approval grants. Guidance updated for current models (no pushy descriptions, no stacked verification, multi-model evals via bsc.py eval --models) in new references/model-guidance.md. Test suite 88/88. v2.1.0: adds bsc.py launcher (doctor/new/check/eval/package), examples/release-notes starter skill, cleaner first-use errors (FileExistsError → InputError, partial-directory cleanup, runs-dir guard), version metadata aligned across plugin.json/skill.yaml/README, CHANGELOG reference links, eval --live now reads the skill's real description instead of passing empty string, _terminate no longer skips process-group cleanup when parent already exited, transcript file opened before subprocess launch. Regression tests added for grader validation edge cases and large-stderr handling. CI on ubuntu-latest + windows-latest. v2.0.2: documentation-accuracy fix — the SKILL.md reference entry for scripts/dependency_graph.py now shows it takes a skill root directory as its positional argument (`<skill-root>`), matching the tool's actual CLI and the README usage line. This is the only portable change salvaged from the stale PR #10 (fix/variance-check-script-gate); its Gate 0 frontmatter-collection and variance-check lint/dependency-graph gating targeted the retired skill-architect layout and have no equivalent in this skill-creator fork, so they were dropped rather than force-fitted. Validation: offline pipeline green (quick_validate pass, lint 0 errors, semantic clean, score 90/100), dependency_graph exercised across skill-root summary/json/dot plus the no-arg usage and bad-path error contracts, regression suite 19/19. v2.0.1: fixes PR review findings for the validation-quality branch — quick_validate again fails when skill.yaml lifecycle and LIFECYCLE.md status disagree, new path-union annotations in the changed validation/IR utilities were replaced with Python 3.8-compatible typing.Union forms, and safe_path_exists now uses Path.relative_to instead of a string-prefix containment check. Added regression tests for lifecycle mismatch rejection, path-prefix traversal rejection, and the absence of PEP 604 unions in the touched modules. v2.0.0: adds the independent multi-agent review and adversarial completion gate (major bump — the review gate now blocks packaging of complex skills that lack a passing review.yaml). Complex skill creation/updates require fresh-context outcome, scope, and architecture reviews before drafting, synthesis with recorded dispositions, and a completion adversary before done. Added review.yaml IR via scripts/review.py, deterministic enforcement via scripts/review_gate.py and ReviewStage, four reviewer agent files, references/independent-review.md, exact evaluation prompts, and regression tests for SkillSpec scoring and review-gate behavior. Applied to this release itself: a fresh completion adversary returned verdict=complete, its three low findings disposed in review.yaml (dev-log eval case added, PackageStage fails closed on error diagnostics, one accepted limitation), completion_gate_status passed; live previous-vs-new eval scored 100% vs 41.7% (+0.58); and six scripts gained `from __future__ import annotations` for Python 3.8 compatibility. v1.10.0: made Design Analysis adaptive and bounded — always-evaluate core lenses plus evaluate-when-relevant lenses (justify each), a scope-selection matrix, a design brief, contradiction handling, and a stopping rule (references/design-analysis.md). Added the entailment-is-not-permission guardrail: discovered work is classified required-and-authorized / required-but-unauthorized (ask) / optional (recommend, never add silently), or out-of-scope (exclude), recorded in the new SkillSpec.authorization_boundaries field; confidence.py flags entailed-but-unauthorized-by-omission and unresolved interpretations. expected_behavior.yaml gained adversarial under/over-scoping and permission-boundary prompts. v1.9.1: completed the v1.9.0 wiring — assess_spec is now invoked by the confidence CLI (runs when spec.yaml exists), spec validation is back-compatible (missing outcome/entailments is a non-fatal warning, not a hard failure), and tests/expected_behavior.yaml now covers the design-analysis behavior (variant enumeration, entailment expansion, stated assumptions, scope control). v1.9.0: added a multi-angle Design Analysis scoping stage — the skill-creator now scopes the real outcome and its interpretations/modes/entailments/failure-points before choosing a structure (references/design-analysis.md, new SkillSpec fields in spec.py, and confidence.py flat-scope/unresolved-interpretation flags) instead of transcribing the literal request. v1.8.0: fixed a wiring regression — the generators/, static_analysis.py, lint.py, dependency_graph.py, migrate_skill.py and generate_report.py features added in v1.2-v1.7 were never referenced in SKILL.md and so were invisible under progressive disclosure. Wired all six into SKILL.md, then hardened the tooling so it cannot recur: static_analysis gained an orphaned-file rule and lint gained a reference-wiring completeness rule, both running in the package pipeline. Prior (2026-07-11) audit wired the original fork's orphans, split Claude.ai/Cowork docs to references/environments.md, expanded trigger tests to 10 positives / 9 near-miss negatives, and added --grade-transcript mode to skill_test.py."

