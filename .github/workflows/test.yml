name: Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC — live canary

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest skills/skill-creator/tests/ tests/ -v

      - name: Validate skill wiring (offline, errors-only)
        shell: bash
        working-directory: skills/skill-creator
        run: |
          # Enforce the progressive-disclosure invariant on every PR instead of only
          # in a bypassable local pre-commit hook. quick_validate must pass outright
          # (exit 0); lint/static report *warnings* (exit 2),
          # which must not fail CI — only error findings (exit 1) block.
          # Strict mode (no --claude-code) so upload-incompatible keys are caught here.
          python -m scripts.quick_validate .
          python -m scripts.lint .            || [ $? -eq 2 ]
          python -m scripts.static_analysis . || [ $? -eq 2 ]
          # Source-rule defect classes (encoding, silent-skip) are errors: they block.
          python -m scripts.source_rules .
          # Docs must match the parser: documented commands/flags/modules/links must exist.
          # Warnings (exit 2, e.g. a stale doc link) report but must not block, per the
          # 0/1/2 contract; only error findings (exit 1) fail CI.
          python -m scripts.doc_sync    || [ $? -eq 2 ]
          # Every registered behavioral claim must resolve to an existing verifier test.
          python -m scripts.claims_check || [ $? -eq 2 ]

      - name: Type-check (pyright)
        run: |
          pip install pyright==1.1.414
          pyright --project .

      - name: Enforce review gate on main and scheduled runs
        # PR development may have a pending review. Main and scheduled runs must
        # have current review evidence; errors (including stale/pending review) block.
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: skills/skill-creator
        run: python -m scripts.review_gate . || [ $? -eq 2 ]

      - name: Smoke-test doctor (no model calls)
        run: python bsc.py doctor

      - name: Validate release-notes example
        shell: bash
        run: |
          # The example is not the toolkit. validate_all.sh must run the toolkit's
          # scripts against it, and bsc.py check must accept the starter skill.
          bash skills/skill-creator/scripts/validate_all.sh examples/release-notes
          python bsc.py check examples/release-notes --runs-dir "${RUNNER_TEMP:-/tmp}/bsc-runs"

  trigger-canary:
    # Each model has four shared cases plus one control call: ten calls total.
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [haiku, sonnet]
    concurrency:
      group: trigger-canary-${{ github.ref }}-${{ matrix.model }}
      cancel-in-progress: false
    env:
      HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        if: env.HAS_OAUTH_TOKEN == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.HAS_OAUTH_TOKEN == 'true'
        run: pip install -r requirements.txt

      - name: Install Claude Code
        if: env.HAS_OAUTH_TOKEN == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run trigger canary
        id: canary
        if: env.HAS_OAUTH_TOKEN == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CANARY_MODEL: ${{ matrix.model }}
        run: |
          canary_dir="$(mktemp -d)/skill-creator"
          mkdir -p "$canary_dir/tests" canary-results
          cp skills/skill-creator/SKILL.md "$canary_dir/"
          cp .github/fixtures/trigger-canary/*.yaml "$canary_dir/tests/"
          set +e
          python bsc.py eval "$canary_dir" --live \
            --model "$CANARY_MODEL" --workers 1 --runs 1 --retries 0 \
            --max-calls 5 --runs-dir canary-results
          rc=$?
          printf '%s' "$rc" > canary-results/exit-code
          exit "$rc"

      - name: Summarize canary status
        if: always()
        env:
          CANARY_MODEL: ${{ matrix.model }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path('canary-results')
          root.mkdir(exist_ok=True)
          exit_path = root / 'exit-code'
          code = int(exit_path.read_text()) if exit_path.exists() else None
          if os.environ['HAS_OAUTH_TOKEN'] != 'true':
              status = 'skipped_missing_credentials'
          elif code == 0 and os.environ['CANARY_OUTCOME'] == 'success':
              status = 'passed'
          elif code == 2:
              status = 'expectations_failed'
          else:
              status = 'infrastructure_failed'
          report = {'model': os.environ['CANARY_MODEL'], 'status': status,
                    'exit_code': code, 'max_calls': 5}
          (root / 'status.json').write_text(json.dumps(report, indent=2) + '\n')
          markdown = f"### Trigger canary: {report['model']}\n\nStatus: {status}\n\nCall limit: 5; four cases and one control; no retries.\n"
          (root / 'status.md').write_text(markdown)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(markdown)
          PY

      - name: Upload canary reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: trigger-canary-${{ matrix.model }}
          path: canary-results/
          if-no-files-found: error
          retention-days: 14
