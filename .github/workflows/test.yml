name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest skills/skill-creator/tests/ -v

      - name: Validate skill wiring (offline, errors-only)
        shell: bash
        working-directory: skills/skill-creator
        run: |
          # Enforce the progressive-disclosure invariant on every PR instead of only
          # in a bypassable local pre-commit hook. quick_validate must pass outright
          # (exit 0); lint/static report pre-existing script-orphan *warnings* (exit 2),
          # which must not fail CI — only error findings (exit 1) block.
          python -m scripts.quick_validate . --claude-code
          python -m scripts.lint .            || [ $? -eq 2 ]
          python -m scripts.static_analysis . || [ $? -eq 2 ]

      - name: Smoke-test doctor (no model calls)
        run: python bsc.py doctor
