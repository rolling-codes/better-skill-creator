name: Package preview

on:
  pull_request:
    paths:
      - ".github/workflows/package-preview.yml"
      - "skills/skill-creator/**"
      - "bsc.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build skill archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install toolkit dependencies
        run: python -m pip install -r requirements.txt
      - name: Package Better Skill Creator
        run: |
          python bsc.py package skills/skill-creator \
            --output "$RUNNER_TEMP/skill-preview" \
            --runs-dir "$RUNNER_TEMP/package-preview-reports"
      - name: Upload skill archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-preview-${{ github.sha }}
          path: ${{ runner.temp }}/skill-preview/skill-creator.skill
          if-no-files-found: error
          retention-days: 7
