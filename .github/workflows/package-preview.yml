name: Package preview

on:
  pull_request:
    paths:
      - ".github/workflows/package-preview.yml"
      - "skills/skill-creator/**"
      - "bsc.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build skill archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install toolkit dependencies
        run: python -m pip install -r requirements.txt
      - name: Package Better Skill Creator
        run: |
          python bsc.py package skills/skill-creator \
            --output "$RUNNER_TEMP/skill-preview" \
            --runs-dir "$RUNNER_TEMP/package-preview-reports"
      - name: Upload skill archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-preview-${{ github.sha }}
          path: ${{ runner.temp }}/skill-preview/skill-creator.skill
          if-no-files-found: error
          retention-days: 7
